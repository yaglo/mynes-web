# MyNES project site, built by GitHub Pages (Jekyll 3.10 via the github-pages gem).
title: MyNES
tagline: NES emulator with composite video and CRT simulation
description: >-
  MyNES is an NES emulator whose GPU frontend encodes the picture as
  composite or RF video and draws the decoded signal on a simulated CRT.
  Its cycle-accurate 6502 core is generated from a timing DSL and passes
  144 of 144 AccuracyCoin tests, and its CRT presets model particular
  monitors and televisions.
url: https://yaglo.github.io
baseurl: /mynes-web
lang: en
author:
  name: Stanislav Yaglo
project:
  code_repo: https://github.com/yaglo/mynes
  releases: https://github.com/yaglo/mynes/releases
  issues: https://github.com/yaglo/mynes/issues
  license: https://github.com/yaglo/mynes/blob/master/LICENSE
  blob: https://github.com/yaglo/mynes/blob/master
  site_repo: https://github.com/yaglo/mynes-web
  # Last code-repository commit that still contains the migrated docs and media.
  source_blob: https://github.com/yaglo/mynes/blob/af99543b987168ac5bb785ea2490d3656de536c0

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  gfm_quirks: paragraph_end
  syntax_highlighter: rouge
highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-relative-links
  - jekyll-redirect-from

# Moved pages list their old URLs under redirect_from; the plugin writes a
# redirect page (_layouts/redirect.html) at each. No redirects.json.
redirect_from:
  json: false

relative_links:
  enabled: true
  collections: false

# Blog posts: /blog/<slug>/
permalink: /blog/:title/
timezone: UTC

exclude:
  - README.md
  - STYLE.md
  - assets/hero/README.md
  - Gemfile
  - Gemfile.lock
  - tools
  - vendor
  - node_modules
  - .jekyll-cache
  - .sass-cache

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      series_title: MyNES internals
  - scope:
      path: ""
    values:
      layout: page
  # Gallery pages hold 960 CSS px renders.
  - scope:
      path: "gallery"
    values:
      section: gallery
      wide: true
