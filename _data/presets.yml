# Presets the site names, by the id of their file in presets/ of the code
# repository (the ids of the hero manifest). name is the preset's name as
# the site gives it, the preset file's name without its qualifier; note is
# the technical note about the hardware the preset models, when there is
# one; variants are spellings of the name that pages must not use; signal
# is the connection the preset's renders use, as the preset's description
# gives it. summary is what the preset models, from the preset file's
# description; the gallery shows it in place of the manifest's short blurb.
# caption is the short line the television switcher shows after the preset
# name, in place of the manifest's blurb, which the recording pipeline
# writes. specs are the rows of the specifications table on the preset's
# Televisions page, each with its value and its source (text and link); the
# values come from the preset files at the commit each row links.

sony_pvm_14l2:
  name: "Sony PVM-14L2"
  signal: "composite"
  note: /notes/pvm-14l2/
  variants: ["PVM 14L2", "PVM14L2", "Sony PVM 14L2"]
  summary: "A Sony PVM-14L2 monitor on composite video, with its aperture grille, a D65 white point and an adaptive comb filter. Its horizontal AFC has a 1 ms time constant, and its RGB bandwidth is 10 MHz at -3 dB."
  caption: "Aperture grille, D65 white, adaptive comb, composite"
  specs:
    - name: "Mask"
      value: "Aperture grille, 1070 triads across the picture"
      source: "presets/sony_pvm_14l2.json at 7822acc"
      url: https://github.com/yaglo/mynes/blob/7822acc/presets/sony_pvm_14l2.json
    - name: "Sony specification"
      value: "0.25 mm aperture grille, 600 TVL"
      source: "Sony PVM-14L2 specifications"
      url: https://www.sony.jp/pro-monitor/products/PVM-14L2/
    - name: "Beam spot height parameter (FWHM)"
      value: "0.28 of a line at black to 0.52 at white"
      source: "presets/sony_pvm_14l2.json at 7822acc"
      url: https://github.com/yaglo/mynes/blob/7822acc/presets/sony_pvm_14l2.json
    - name: "White point"
      value: "6500 K (D65)"
      source: "presets/sony_pvm_14l2.json at 7822acc"
      url: https://github.com/yaglo/mynes/blob/7822acc/presets/sony_pvm_14l2.json
