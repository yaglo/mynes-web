# Renders shown by _includes/crop.html, compare.html and pan.html, by id:
#   {% include crop.html id="castlevania-castle-hall-pvm-detail" %}
#
# Paths are relative to the site root. Crop widths and heights are even, and
# multiples of 6 where the crop allows it: then 1:1 is exact at pixel ratios
# 1.5 and 3 too, where a size that is not a multiple of 3 falls between the
# 1/64 CSS px steps browsers lay out in.
#   file      the 1:1 crop (the 2x candidate), or the full frame for pan.html
#   file_1x   the crop reduced by Image.reduce(2); tools/make_crop.py writes
#             both from a frame
#   hdr, hdr_1x  PQ AVIF versions (BT.2020, CICP 9/16/9) when there are any
#   full      the lossless frame the figure links to
#   crop      [x, y, width, height] of the crop in the frame; all even
#   frame     [width, height] of the frame
#   game, scene, preset (an id of the hero manifest's presets, or
#   preset_name), signal (the connection the render used)
#   alt       one sentence naming the game, the scene and the preset
#   caption   replaces the generated caption (for images that are not a
#             single crop); it keeps the render-scale and render-range spans
#   x, y      pan.html: the source pixel at the centre of the view at first

